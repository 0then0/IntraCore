services:
  web:
    build:
      context: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-for-local-development}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      POSTGRES_DB: ${POSTGRES_DB:-intracore}
      POSTGRES_USER: ${POSTGRES_USER:-intracore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intracore}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL:-http://localhost:8000/cms}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      HR_SYNC_ENABLED: ${HR_SYNC_ENABLED:-false}
      PHOTO_MODERATION_EMAIL_ENABLED: ${PHOTO_MODERATION_EMAIL_ENABLED:-false}
    depends_on:
      - db
      - redis

  celery:
    build:
      context: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-for-local-development}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-intracore}
      POSTGRES_USER: ${POSTGRES_USER:-intracore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intracore}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL:-http://localhost:8000/cms}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      HR_SYNC_ENABLED: ${HR_SYNC_ENABLED:-false}
      PHOTO_MODERATION_EMAIL_ENABLED: ${PHOTO_MODERATION_EMAIL_ENABLED:-false}
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intracore}
      POSTGRES_USER: ${POSTGRES_USER:-intracore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intracore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

volumes:
  postgres_data:
